name: LARO checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
